<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-Tube IA - Devine ce que tu penses</title>
  <style>
    body {
      background-color: #000;
      font-family: 'Arial', sans-serif;
      color: white;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .logo {
      margin-top: 30px;
    }

    .logo img {
      width: 120px;
      height: auto;
    }

    h1 {
      font-size: 26px;
      margin: 20px auto;
      color: #0ff;
      font-family: 'Courier New', Courier, monospace;
    }

    .question-box {
      margin: 40px auto;
      background-color: #111;
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 0 15px rgba(0,255,255,0.2);
    }

    .question {
      font-size: 22px;
      margin-bottom: 30px;
    }

    .responses {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .response-button {
      background-color: white;
      color: black;
      padding: 12px 24px;
      border-radius: 25px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      width: 200px;
    }

    .response-button:hover {
      background-color: #ddd;
    }

    .response-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .response-area input {
      padding: 10px;
      border-radius: 15px;
      border: none;
      width: 250px;
      font-size: 16px;
    }

    .footer {
      margin-top: 40px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <audio id="robot-voice" src="voix_robotique_question.mp3"></audio>

  <div class="logo">
    <img src="logo_robot.jpg" alt="Robot Logo">
  </div>

  <h1>Bienvenue sur mon petit robot !<br>Il peut deviner ce que tu penses 🤖</h1>

  <div class="question-box">
    <div class="question">Chargement...</div>

    <div class="responses">
      <button class="response-button" onclick="filterCharacters('oui')">Oui</button>
      <button class="response-button" onclick="filterCharacters('non')">Non</button>
      <button class="response-button" onclick="filterCharacters('peut-être')">Peut-être</button>

      <div class="response-area">
        <img src="logo_robot.jpg" alt="Avatar Robot" style="width: 50px;">
        <input type="text" placeholder="Réponse personnalisée...">
      </div>
    </div>
  </div>

  <div class="footer">
    <p>Version P3 très robotique en développement...</p>
  </div>

  <script>
    const characters = Array.from({ length: 5000 }, (_, i) => ({
      name: `Personnage ${i + 1}`,
      traits: {
        fille: Math.random() < 0.5,
        animal: Math.random() < 0.5,
        masculin: Math.random() < 0.5,
        tiktok: Math.random() < 0.5,
        youtube: Math.random() < 0.5,
        casquette: Math.random() < 0.5,
        virtuel: Math.random() < 0.5
      }
    }));

    const baseQuestions = [
      { key: "fille", text: ["Est-ce que ton personnage est une fille ?"] },
      { key: "animal", text: ["Ton personnage est-il un animal ?"] },
      { key: "masculin", text: ["Ton personnage est-il un garçon ?"] },
      { key: "tiktok", text: ["Ton personnage est-il célèbre sur TikTok ?"] },
      { key: "youtube", text: ["Ton personnage fait-il des vidéos sur YouTube ?"] },
      { key: "casquette", text: ["Ton personnage porte-t-il une casquette ?"] },
      { key: "virtuel", text: ["Ton personnage est-il virtuel ?"] }
    ];

    const questions = Array.from({ length: 100 }, (_, i) => {
      const trait = baseQuestions[i % baseQuestions.length];
      return { text: trait.text[0], key: trait.key };
    });

    let current = 0;
    let possibilities = [...characters];

    function showNextQuestion() {
      if (current >= questions.length || possibilities.length <= 1) {
        const q = document.querySelector(".question");
        if (possibilities.length === 0) q.textContent = "Je n'ai pas pu deviner 😢";
        else q.textContent = `Je pense à : ${possibilities[0].name} ! 🤖`;
        return;
      }

      document.querySelector(".question").textContent = questions[current].text;
      const audio = document.getElementById("robot-voice");
      if (audio) audio.play();
    }

    function filterCharacters(answer) {
      const key = questions[current].key;
      if (answer === "oui") possibilities = possibilities.filter(c => c.traits[key] === true);
      else if (answer === "non") possibilities = possibilities.filter(c => c.traits[key] === false);
      current++;
      showNextQuestion();
    }

    window.addEventListener("DOMContentLoaded", showNextQuestion);
  </script>
</body>
</html>
