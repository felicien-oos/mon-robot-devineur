<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-Tube IA - Devine ce que tu penses</title>
  <style>
    body {
      background-color: #000;
      font-family: 'Arial', sans-serif;
      color: white;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .logo {
      margin-top: 30px;
    }

    .logo img {
      width: 120px;
      height: auto;
    }

    h1 {
      font-size: 26px;
      margin: 20px auto;
      color: #0ff;
      font-family: 'Courier New', Courier, monospace;
    }

    .question-box {
      margin: 40px auto;
      background-color: #111;
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 0 15px rgba(0,255,255,0.2);
    }

    .question {
      font-size: 22px;
      margin-bottom: 30px;
    }

    .responses {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .response-button {
      background-color: white;
      color: black;
      padding: 12px 24px;
      border-radius: 25px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      width: 200px;
    }

    .response-button:hover {
      background-color: #ddd;
    }

    .response-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .response-area input {
      padding: 10px;
      border-radius: 15px;
      border: none;
      width: 250px;
      font-size: 16px;
    }

    .footer {
      margin-top: 40px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="logo_robot.jpg" alt="Robot Logo" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Robot_icon.svg/1024px-Robot_icon.svg.png';">
  </div>

  <h1>Bienvenue sur mon petit robot !<br>Il peut deviner ce que tu penses 🤖</h1>

  <div class="question-box">
    <div class="question">Chargement...</div>

    <div class="responses">
      <button class="response-button" onclick="filterCharacters('oui')">Oui</button>
      <button class="response-button" onclick="filterCharacters('non')">Non</button>
      <button class="response-button" onclick="filterCharacters('peut-être')">Peut-être</button>

      <div class="response-area">
        <img src="logo_robot.jpg" alt="Avatar Robot" style="width: 50px;" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Robot_icon.svg/1024px-Robot_icon.svg.png';">
        <input type="text" placeholder="Réponse personnalisée..." id="custom-input">
      </div>
    </div>
  </div>

  <div class="footer">
    <p>Version P3 très robotique en développement...</p>
  </div>

  <script>
    const traitsDescriptions = [
      "a les cheveux blonds", "porte des lunettes", "est un héros", "vit sous la mer", "peut voler",
      "a une cape", "joue dans des films", "est un animal", "vient d'un dessin animé", "est très fort",
      "porte un chapeau", "est une star de la télévision", "vit dans un château", "a un accent célèbre",
      "est très intelligent", "a un pouvoir magique", "est célèbre sur Internet", "a une moustache",
      "est connu des enfants", "est dans un jeu vidéo"
    ];

    const traits = traitsDescriptions.map((desc, i) => ({ key: `trait_${i+1}`, description: desc }));

    const characters = Array.from({ length: 100 }, (_, i) => {
      const traitsObj = {};
      traits.forEach(trait => {
        traitsObj[trait.key] = Math.random() < 0.5;
      });
      return {
        name: `Personnage ${i + 1}`,
        traits: traitsObj
      };
    });

    const questions = traits.map(trait => ({ text: `Ton personnage ${trait.description} ?`, key: trait.key }));
    const shuffledQuestions = questions.sort(() => 0.5 - Math.random());

    let current = 0;
    let askedKeys = new Set();
    let possibilities = [...characters];

    function showNextQuestion() {
      if (current >= shuffledQuestions.length || possibilities.length <= 1) {
        const q = document.querySelector(".question");
        if (possibilities.length === 0) q.textContent = "Je n'ai pas pu deviner 😢";
        else q.textContent = `Je pense à : ${possibilities[0].name} ! 🤖`;
        return;
      }

      while (current < shuffledQuestions.length && askedKeys.has(shuffledQuestions[current].key)) {
        current++;
      }

      if (!shuffledQuestions[current]) {
        document.querySelector(".question").textContent = "Plus de questions disponibles.";
        return;
      }

      const question = shuffledQuestions[current];
      askedKeys.add(question.key);
      document.querySelector(".question").textContent = question.text;

      const utterance = new SpeechSynthesisUtterance(question.text);
      utterance.lang = 'fr-FR';
      speechSynthesis.speak(utterance);
    }

    function filterCharacters(answer) {
      const key = shuffledQuestions[current]?.key;
      if (!key) return;
      if (answer === "oui") possibilities = possibilities.filter(c => c.traits[key] === true);
      else if (answer === "non") possibilities = possibilities.filter(c => c.traits[key] === false);
      current++;
      showNextQuestion();
    }

    document.getElementById("custom-input").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        const input = event.target.value.toLowerCase();
        if (input.includes("oui")) filterCharacters("oui");
        else if (input.includes("non")) filterCharacters("non");
        else if (input.includes("peut")) filterCharacters("peut-être");
        else {
          document.querySelector(".question").textContent = "Merci pour ta réponse ! Passons à la suivante.";
          current++;
          showNextQuestion();
        }
        event.target.value = "";
      }
    });

    window.addEventListener("DOMContentLoaded", showNextQuestion);
  </script>
</body>
</html>
