<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-Tube IA - Devine ce que tu penses</title>
  <style>
    body {
      background-color: #000;
      font-family: 'Arial', sans-serif;
      color: white;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .logo {
      margin-top: 30px;
    }

    .logo img {
      width: 120px;
      height: auto;
    }

    h1 {
      font-size: 26px;
      margin: 20px auto;
      color: #0ff;
      font-family: 'Courier New', Courier, monospace;
    }

    .question-box {
      margin: 40px auto;
      background-color: #111;
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 0 15px rgba(0,255,255,0.2);
    }

    .question {
      font-size: 22px;
      margin-bottom: 30px;
    }

    .responses {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .response-button {
      background-color: white;
      color: black;
      padding: 12px 24px;
      border-radius: 25px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      width: 200px;
    }

    .response-button:hover {
      background-color: #ddd;
    }

    .response-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .response-area input {
      padding: 10px;
      border-radius: 15px;
      border: none;
      width: 250px;
      font-size: 16px;
    }

    .footer {
      margin-top: 40px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <audio id="robot-voice" src="https://upload.wikimedia.org/wikipedia/commons/8/84/Beep-beep.mp3"></audio>

  <div class="logo">
    <img src="logo_robot.jpg" alt="Robot Logo">
  </div>

  <h1>Bienvenue sur mon petit robot !<br>Il peut deviner ce que tu penses 🤖</h1>

  <div class="question-box">
    <div class="question">Chargement...</div>

    <div class="responses">
      <button class="response-button" onclick="filterCharacters('oui')">Oui</button>
      <button class="response-button" onclick="filterCharacters('non')">Non</button>
      <button class="response-button" onclick="filterCharacters('peut-être')">Peut-être</button>

      <div class="response-area">
        <img src="logo_robot.jpg" alt="Avatar Robot" style="width: 50px;">
        <input type="text" placeholder="Réponse personnalisée..." id="custom-input">
      </div>
    </div>
  </div>

  <div class="footer">
    <p>Version P3 très robotique en développement...</p>
  </div>

  <script>
    const traits = [
      "a des lunettes", "porte un chapeau", "est un animal", "parle plusieurs langues",
      "est un super-héros", "est un méchant", "est une femme", "a une moustache",
      "est un enfant", "porte des vêtements rouges", "vit dans un château", "vole dans le ciel",
      "vient de l’espace", "a une voix grave", "est timide", "a beaucoup d’amis",
      "est très intelligent", "a une épée", "est petit", "est très grand",
      "porte un uniforme", "a des pouvoirs magiques", "a une queue", "est un robot",
      "vit sous l’eau", "est connu sur Internet", "est très rapide", "est très fort",
      "est un animal domestique", "est célèbre pour ses blagues", "a un accent",
      "a des cheveux bleus", "utilise un ordinateur", "porte des lunettes de soleil",
      "a un animal de compagnie", "a un frère ou une sœur", "a peur du noir",
      "est une star de la télévision", "travaille à l’école", "a une grande bouche",
      "est un personnage de dessin animé", "vit dans une forêt", "mange souvent des gâteaux",
      "porte des bottes", "est curieux", "est un extraterrestre", "porte une cape",
      "est un héros de jeu vidéo", "parle avec une voix bizarre", "a un rire unique",
      "est souvent en colère", "est toujours joyeux"
    ];

    const characters = Array.from({ length: 10000 }, (_, i) => {
      const traitsObj = {};
      traits.forEach(trait => {
        traitsObj[trait] = Math.random() < 0.5;
      });
      return {
        name: `Personnage ${i + 1}`,
        traits: traitsObj
      };
    });

    const questions = traits.map(trait => ({ text: `Ton personnage ${trait} ?`, key: trait }));
    const shuffledQuestions = questions.sort(() => 0.5 - Math.random());

    let current = 0;
    let askedKeys = new Set();
    let possibilities = [...characters];

    function showNextQuestion() {
      if (current >= shuffledQuestions.length || possibilities.length <= 1) {
        const q = document.querySelector(".question");
        if (possibilities.length === 0) q.textContent = "Je n'ai pas pu deviner 😢";
        else q.textContent = `Je pense à : ${possibilities[0].name} ! 🤖`;
        return;
      }

      while (current < shuffledQuestions.length && askedKeys.has(shuffledQuestions[current].key)) {
        current++;
      }

      if (!shuffledQuestions[current]) {
        document.querySelector(".question").textContent = "Plus de questions disponibles.";
        return;
      }

      const question = shuffledQuestions[current];
      askedKeys.add(question.key);
      document.querySelector(".question").textContent = question.text;
      const audio = document.querySelector(".question").textContent = question.text;
speak(question.text);
function speak(text) {
  const synth = window.speechSynthesis;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "fr-FR";
  utterance.pitch = 1;
  utterance.rate = 1;
  synth.cancel(); // stop previous if any
  synth.speak(utterance);
}

    }

    function filterCharacters(answer) {
      const key = shuffledQuestions[current]?.key;
      if (!key) return;
      if (answer === "oui") possibilities = possibilities.filter(c => c.traits[key] === true);
      else if (answer === "non") possibilities = possibilities.filter(c => c.traits[key] === false);
      current++;
      showNextQuestion();
    }

    document.getElementById("custom-input").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        const input = event.target.value.toLowerCase();
        if (input.includes("oui")) filterCharacters("oui");
        else if (input.includes("non")) filterCharacters("non");
        else if (input.includes("peut")) filterCharacters("peut-être");
        else {
          document.querySelector(".question").textContent = "Merci pour ta réponse ! Passons à la suivante.";
          current++;
          showNextQuestion();
        }
        event.target.value = "";
      }
    });

    window.addEventListener("DOMContentLoaded", showNextQuestion);
  </script>
</body>
</html>
