<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Robot Devin</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }
    .response-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background-color: #111;
      padding: 20px;
      border-radius: 20px;
      margin: 40px auto;
      width: fit-content;
    }
    .response-area img {
      width: 120px;
    }
    .question-box {
      margin-top: 20px;
    }
    .answer-buttons button {
      margin: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background-color: #fff;
      color: #000;
      font-size: 16px;
      cursor: pointer;
    }
    .robot-reply {
      margin-top: 20px;
      font-size: 18px;
      color: #0f0;
      font-style: italic;
    }
    .footer {
      margin-top: 40px;
      font-size: 14px;
      color: #aaa;
    }
    .mini-chat {
      margin-top: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .mini-chat img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }
    .mini-chat input {
      border-radius: 25px;
      border: 2px solid #000;
      padding: 10px 20px;
      font-size: 16px;
      width: 60%;
      background-color: #fff;
      color: #000;
    }
    .mini-chat span {
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="response-area">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Robot_icon.svg/1024px-Robot_icon.svg.png" alt="Robot Logo">
    <div>
      <h1>Bienvenue sur mon petit robot !</h1>
      <p>Il peut deviner ce que tu penses 🤖</p>
    </div>
  </div>

  <div class="question-box" id="questionBox">
    <p id="questionText">Chargement de la première question...</p>
    <div class="answer-buttons">
      <button onclick="handleAnswer('oui')">Oui</button>
      <button onclick="handleAnswer('non')">Non</button>
      <button onclick="handleAnswer('peut-être')">Peut-être</button>
      <button onclick="handleCustomAnswer()">Réponse personnalisée</button>
    </div>
    <div class="robot-reply" id="robotReply"></div>
  </div>

  <div class="mini-chat">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Robot_icon.svg/1024px-Robot_icon.svg.png" alt="Mini Robot">
    <input type="text" id="miniInput" placeholder="Pose-moi une question">
    <span>ou si tu veux parler, parle-moi</span>
  </div>

  <div class="footer">Version P3 très robotique en développement...</div>

  <audio id="voicePlayer"></audio>

  <script>
    const questions = [];
    for (let i = 1; i <= 10000; i++) {
      questions.push(`Question numéro ${i} : Ceci est une question test ?`);
    }

    const motsGentils = [
      "Bonjour", "Merci", "Félicitations", "S'il te plaît", "Bravo", "Enchanté", "Heureux de te voir",
      "Bien joué", "Superbe", "Génial", "Formidable", "Cool", "Tu es fantastique", "Tu es unique",
      "Bonne chance", "Bonne journée", "Bon courage", "Tu es apprécié", "Je t'aime bien", "Chouette"
    ];

    while (motsGentils.length < 10000) {
      motsGentils.push("Mot gentil " + motsGentils.length);
    }

    const reponses = [
      "Oui, probablement !",
      "Non, je ne pense pas.",
      "Peut-être... tu en penses quoi ?",
      "C’est possible !",
      "Pas sûr de ça.",
      "Je dirais que oui.",
      "Hmm, je ne crois pas.",
      "Pourquoi pas ?",
      "Absolument !",
      "Certainement pas."
    ];

    function getRandomReponse() {
      return reponses[Math.floor(Math.random() * reponses.length)];
    }

    let questionIndex = 0;

    function speak(text) {
      const audio = document.getElementById('voicePlayer');
      const encodedText = encodeURIComponent(text);
      const url = `https://api.streamelements.com/kappa/v2/speech?voice=Brian&text=${encodedText}`;
      audio.src = url;
      audio.play();
    }

    function showQuestion() {
      const question = questions[questionIndex % questions.length];
      document.getElementById('questionText').innerText = question;
      document.getElementById('robotReply').innerText = "";
      speak(question);
    }

    function handleAnswer(answer) {
      console.log("Réponse donnée :", answer);
      const reply = getRandomReponse();
      document.getElementById('robotReply').innerText = reply;
      speak(reply);
      questionIndex++;
      setTimeout(showQuestion, 2500);
    }

    function handleCustomAnswer() {
      const custom = prompt("Entrez votre réponse :");
      if (custom) {
        console.log("Réponse personnalisée :", custom);
        const reply = getRandomReponse();
        document.getElementById('robotReply').innerText = reply;
        speak(reply);
        questionIndex++;
        setTimeout(showQuestion, 2500);
      }
    }

    document.getElementById("miniInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        const msg = this.value.trim();
        if (msg.length > 0) {
          console.log("Message dans la mini-barre :", msg);
          const response = "Merci pour ta question : " + msg;
          speak(response);
          document.getElementById('robotReply').innerText = response;
          this.value = "";
        }
      }
    });

    showQuestion();
  </script>
</body>
</html>
