<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Robot Devin</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }
    .response-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background-color: #111;
      padding: 20px;
      border-radius: 20px;
      margin: 40px auto;
      width: fit-content;
    }
    .response-area img {
      width: 120px;
    }
    .question-box {
      margin-top: 20px;
    }
    .answer-buttons button {
      margin: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background-color: #fff;
      color: #000;
      font-size: 16px;
      cursor: pointer;
    }
    .footer {
      margin-top: 40px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="response-area">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Robot_icon.svg/1024px-Robot_icon.svg.png" alt="Robot Logo">
    <div>
      <h1>Bienvenue sur mon petit robot !</h1>
      <p>Il peut deviner ce que tu penses 🤖</p>
    </div>
  </div>

  <div class="question-box" id="questionBox">
    <p id="questionText">Chargement de la première question...</p>
    <div class="answer-buttons">
      <button onclick="handleAnswer('oui')">Oui</button>
      <button onclick="handleAnswer('non')">Non</button>
      <button onclick="handleAnswer('peut-être')">Peut-être</button>
      <button onclick="handleCustomAnswer()">Réponse personnalisée</button>
    </div>
  </div>

  <div class="footer">Version P3 très robotique en développement...</div>

  <audio id="voicePlayer"></audio>

  <script>
    const questions = [
      "Ton personnage est-il une star de la télévision ?",
      "Ton personnage est-il un animal ?",
      "Ton personnage porte-t-il souvent une casquette ?",
      "Ton personnage est-il connu sur TikTok ?",
      "Ton personnage est-il réel ou fictif ?",
      "Ton personnage est-il associé à un jeu vidéo ?",
      "Ton personnage chante-t-il ?",
      "Ton personnage fait-il partie d'un dessin animé ?",
      "Ton personnage utilise-t-il les réseaux sociaux ?",
      "Ton personnage est-il masculin ?"
    ];

    let questionIndex = 0;

    function speak(text) {
      const audio = document.getElementById('voicePlayer');
      const encodedText = encodeURIComponent(text);
      const url = `https://api.streamelements.com/kappa/v2/speech?voice=Brian&text=${encodedText}`;
      audio.src = url;
      audio.play();
    }

    function showQuestion() {
      const question = questions[questionIndex % questions.length];
      document.getElementById('questionText').innerText = question;
      speak(question);
    }

    function handleAnswer(answer) {
      console.log("Réponse donnée :", answer);
      questionIndex++;
      showQuestion();
    }

    function handleCustomAnswer() {
      const custom = prompt("Entrez votre réponse :");
      if (custom) {
        console.log("Réponse personnalisée :", custom);
        questionIndex++;
        showQuestion();
      }
    }

    // Lancer la première question
    showQuestion();
  </script>
</body>
</html>
